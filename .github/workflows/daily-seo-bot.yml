# GEET-SENTINEL daily SEO bot — dual-redundancy free cron.
#
# Runs even if Vercel Hobby cron limits apply or the site is hosted elsewhere.
# Setup (one time):
#   1. GitHub repo → Settings → Secrets and variables → Actions → New secret
#      Name: CRON_SECRET / Value: the same secret as Vercel env CRON_SECRET
#      (or the auto-generated vault secret shown inside /admin/seo-bot).
#   2. Optional: add INDEXNOW_KEY secret to enable the IndexNow sitemap ping.
#
# Triggers the scan at 18:00 UTC daily (11:30 PM IST) + on-demand via
# the Actions tab (workflow_dispatch).

name: Daily SEO Bot Scan

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  serp-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger GEET-SENTINEL scan
        run: |
          HTTP_CODE=$(curl -s -o /tmp/sentinel.json -w "%{http_code}" \
            --max-time 55 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://geetprince.me/api/cron/seo-bot")
          echo "Scan HTTP status: ${HTTP_CODE}"
          head -c 500 /tmp/sentinel.json; echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::GEET-SENTINEL scan failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Ping IndexNow with sitemap
        if: ${{ vars.INDEXNOW_ENABLED == 'true' && secrets.INDEXNOW_KEY != '' }}
        continue-on-error: true
        run: |
          curl -s --max-time 30 -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"geetprince.me\",\"key\":\"${{ secrets.INDEXNOW_KEY }}\",\"keyLocation\":\"https://geetprince.me/${{ secrets.INDEXNOW_KEY }}.txt\",\"urlList\":[\"https://geetprince.me/\",\"https://geetprince.me/sitemap.xml\"]}"
